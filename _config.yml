title: 개발 공책
description: 만들면서 알게 된 것을 적어 두는 곳. 판타지 웹 게임 개발기와 개발 팁·노하우.
lang: ko
timezone: Asia/Seoul
url: "https://wh209302.github.io"
baseurl: ""
defaults:
  - scope: { path: "" }
    values:
      image: /assets/img/og-default.png
      lang: ko
  # 영어판: en/ 아래 쪽과 en/_posts 글
  - scope: { path: "en" }
    values:
      lang: en
  - scope: { path: "en", type: posts }
    values:
      lang: en
      permalink: /en/:year/:month/:day/:title/
permalink: /:year/:month/:day/:title/
theme: null
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - .gems
  - vendor

# 검색 노출: 서치 콘솔에서 받은 확인 코드만 넣습니다(공개돼도 되는 값).
