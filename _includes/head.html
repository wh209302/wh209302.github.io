<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  // 저장된 화면 밝기를 첫 그림 전에 적용해 깜박임을 막습니다.
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% feed_meta %}
{% seo %}
{%- if site.naver_verification != "" %}
<meta name="naver-site-verification" content="{{ site.naver_verification }}">
{%- endif %}
{%- if page.layout == "post" %}
{%- for t in page.tags %}
<meta property="article:tag" content="{{ t }}">
{%- endfor %}
{%- if page.tags.size > 0 %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}
{%- endif %}
{%- if site.goatcounter != "" %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{%- endif %}
