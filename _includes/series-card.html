{%- assign s = include.series -%}
{%- assign parts = P | where: "series", s.id | sort: "date" -%}{%- assign sn = s[L] | default: s -%}
<a class="series-card" href="{{ B | append: '/series/' | relative_url }}#{{ s.id }}">
  <span class="series-card__count mono">{{ parts | size }}{{ T.count }} {{ T.ongoing }}</span>
  <span class="series-card__name">{{ sn.name }}</span>
  <span class="series-card__desc">{{ sn.desc }}</span>
</a>
